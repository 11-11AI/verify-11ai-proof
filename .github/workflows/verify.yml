name: verify-live-proof

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify live governance evidence signature
        run: python verify.py --json
